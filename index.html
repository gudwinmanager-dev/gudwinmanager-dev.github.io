<script>

<script>
(function () {
  /* ════════════════════════════════════════════════
     Страница с кнопкой (основная с 28.09). С 28.09 ~04:00 кнопка ведёт сразу на заявку в канал (ссылка name=site),
     бот принимает заявки сразу (gate_mode=off), сам бот людям не показывается. Считает каждый шаг человека:
       открыл страницу (Worker /p, pv=2) → нажал «Open Telegram» (tap) →
       Telegram открылся (app) / не открылся: точно — Android вернул сюда (noapp), примерно — за 2,5 с ничего (noapp_t) →
       нажал «Get Telegram» (dl) / «open again» (again) / «Open in browser» (web).
     Шаги уходят маяком в Worker (/e), бот забирает их и показывает в воронке.
     ════════════════════════════════════════════════ */
  var JOIN = "PjfwYA9it-xkMzFi";   // ссылка-заявка в канал (name=site); прежний путь через бота: tg://resolve?domain=mia_accept_bot
  var W = "https://orange-dust-9d48.edge-relay-91k.workers.dev";
  var APP_MS = 2500;    // столько ждём, что Telegram откроется

  var q = new URLSearchParams(location.search);
  var src = (q.get("s") || q.get("src") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 10);
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var ref = "";
  try { ref = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) {}

  /* номер посетителя (тот же, что у основной страницы): повторное открытие — тот же человек */
  function rnd() {
    var a = new Uint8Array(9), s = "", abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
    try { crypto.getRandomValues(a); } catch (e) { for (var k = 0; k < a.length; k++) a[k] = Math.floor(Math.random() * 256); }
    for (var i = 0; i < a.length; i++) s += abc.charAt(a[i] & 63) + abc.charAt(a[i] >> 2 & 63);
    return s.slice(0, 16);
  }
  var vid = "";
  try { vid = localStorage.getItem("mv") || ""; } catch (e) {}
  if (!/^[A-Za-z0-9_-]{8,24}$/.test(vid)) {
    vid = rnd();
    try { localStorage.setItem("mv", vid); } catch (e) {}
  }

  var payload = "x-" + src, mac = "", ready = false;
  function macOf(p) {
    try {
      var s = p.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      var b = atob(s), h = "";
      for (var i = b.length - 4; i < b.length; i++) h += ("0" + b.charCodeAt(i).toString(16)).slice(-2);
      return h;
    } catch (e) { return ""; }
  }
  function setPayload(p) {
    if (p && p.length <= 64 && /^[A-Za-z0-9_-]+$/.test(p)) {
      payload = p;
      mac = p.indexOf("x-") === 0 ? "" : macOf(p);
    }
    ready = true;
    links();
  }

  function beacon(kind) {
    var u = W + "/e?k=" + kind + "&v=" + encodeURIComponent(vid) + "&m=" + mac + "&s=" + encodeURIComponent(src);
    try { if (navigator.sendBeacon && navigator.sendBeacon(u)) return; } catch (e) {}
    try { fetch(u, { method: "POST", mode: "no-cors", keepalive: true }); return; } catch (e) {}
    try { new Image().src = u; } catch (e) {}
  }

  function tgLink() { return "tg://join?invite=" + JOIN; }
  function webLink() { return "https://t.me/+" + JOIN; }
  function backLink() {   // сюда Android вернёт, если Telegram не установлен
    return location.origin + location.pathname + "?noapp=1&s=" + encodeURIComponent(src) + "&p=" + encodeURIComponent(payload);
  }
  function intentLink() {
    return "intent://join?invite=" + JOIN +
      "#Intent;scheme=tg;S.browser_fallback_url=" + encodeURIComponent(backLink()) + ";end";
  }
  var store = isIOS ? "https://apps.apple.com/app/telegram-messenger/id686449807"
    : isAndroid ? "https://play.google.com/store/apps/details?id=org.telegram.messenger"
    : "https://desktop.telegram.org/";

  var el = function (id) { return document.getElementById(id); };
  function links() {
    el("open").href = isAndroid ? intentLink() : isIOS ? tgLink() : webLink();
    el("again").href = el("open").href;
    el("web").href = webLink();
    el("get").href = store;
  }
  function showNoApp() { el("main").hidden = true; el("noapp").hidden = false; }

  /* Telegram открылся = страница ушла в фон вскоре после нажатия */
  var t0 = 0, sentApp = false, timer = null;
  function onHidden() {
    if (t0 && !sentApp && Date.now() - t0 < 10000) { sentApp = true; beacon("app"); }
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") onHidden(); });
  window.addEventListener("pagehide", onHidden);

  function go(kind, ev) {
    ev.preventDefault();
    if (!ready) setPayload("");            // метка ещё не пришла — идём без неё, но сразу: браузер пускает в приложение только по нажатию
    beacon(kind);
    if (!isAndroid && !isIOS) { location.href = webLink(); return; }   // компьютер: страница Telegram сама откроет приложение
    t0 = Date.now(); sentApp = false;
    clearTimeout(timer);
    location.href = el("open").href;
    timer = setTimeout(function () {
      if (!sentApp && document.visibilityState === "visible") { beacon("noapp_t"); showNoApp(); }
    }, APP_MS);
  }

  links();
  el("open").addEventListener("click", function (ev) { go("tap", ev); });
  el("again").addEventListener("click", function (ev) { go("again", ev); });
  el("get").addEventListener("click", function () { beacon("dl"); });
  el("web").addEventListener("click", function () { beacon("web"); });

  if (q.get("noapp") === "1") {                // Android вернул сюда: Telegram на телефоне нет — это точно
    setPayload(q.get("p") || "");
    beacon("noapp");
    showNoApp();
    return;
  }

  /* метку ждём сколько нужно: человек всё равно сначала жмёт кнопку (нажал раньше — уйдёт без метки, см. go) */
  try {
    fetch(W + "/p?s=" + encodeURIComponent(src) + "&r=" + encodeURIComponent(ref) + "&v=" + encodeURIComponent(vid) + "&pv=2",
          { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!ready) setPayload(j && typeof j.p === "string" ? j.p : ""); })
      .catch(function () { if (!ready) setPayload(""); });
  } catch (e) { setPayload(""); }
})();
</script>
